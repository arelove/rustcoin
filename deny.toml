# deny.toml — cargo-deny: безопасность зависимостей
# Установка: cargo install cargo-deny
# Запуск: cargo deny check

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
# Проверяет CVE-уязвимости в зависимостях
db-path    = "~/.cargo/advisory-db"
db-urls    = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained  = "warn"
yanked        = "deny"
notice        = "warn"

[licenses]
# Только разрешённые лицензии
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Unicode-DFS-2016", "CC0-1.0"]
deny  = ["GPL-2.0", "GPL-3.0", "AGPL-3.0"]
copyleft = "warn"

[bans]
# Запрет дублирующихся зависимостей
multiple-versions = "warn"
wildcards         = "deny"   # '*' версии запрещены
deny = [
    # Запрещаем небезопасные крейты
    { name = "openssl" },    # используем rustls вместо
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
