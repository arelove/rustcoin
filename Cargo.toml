[workspace]
resolver = "2"
members = [
    "crates/primitives",
    "crates/crypto",
    "crates/consensus",
    "crates/storage",
    "crates/mempool",
    "crates/p2p",
    "crates/vm",
    "crates/rpc",
    "crates/wallet",
    "crates/node",
    "crates/cli",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
rust-version = "1.82"
authors     = ["Arelove <ar3love@outlook.com>"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/arelove/quench"
homepage    = "https://github.com/arelove/quench"
keywords    = ["blockchain", "cryptocurrency", "web3", "p2p", "wasm"]
categories  = ["cryptography", "network-programming"]

# ─── Shared dependencies (всё в одном месте, версии не расходятся) ────────────
[workspace.dependencies]
# Async runtime
tokio        = { version = "1.36", features = ["full"] }
tokio-util = { version = "0.7" }
futures      = "0.3"

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
bincode      = "2.0.0-rc.3"    # быстрая бинарная сериализация

# Cryptography
sha2         = "0.10"
sha3         = "0.10"           # Keccak (Ethereum-совместимость)
ripemd       = "0.1"
ed25519-dalek = { version = "2", features = ["serde"] }
k256         = { version = "0.13", features = ["ecdsa"] }  # secp256k1
rand         = "0.8"
rand_core    = "0.6"
hex          = { version = "0.4", features = ["serde"] }
bs58         = "0.5"            # Base58Check для адресов
zeroize      = { version = "1", features = ["derive"] }  # безопасное очищение памяти

# Storage
rocksdb      = "0.21"

# Networking
libp2p       = { version = "0.53", features = [
    "tokio", "tcp", "noise", "yamux",
    "gossipsub", "kad", "mdns", "identify",
    "request-response", "ping",
] }

# RPC / HTTP
axum         = { version = "0.7", features = ["macros"] }
tower        = "0.4"
tower-http   = { version = "0.5", features = ["cors", "trace"] }
jsonrpsee    = { version = "0.22", features = ["server", "client"] }

# WASM VM
wasmtime     = { version = "18", features = ["async"] }
wat          = "1"              # WAT → WASM компилятор (для тестов)

# Error handling
thiserror    = "1"
anyhow       = "1"

# Logging / Tracing
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap         = { version = "4", features = ["derive", "env"] }

# Utilities
bytes        = "1"
uuid         = { version = "1", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
dashmap      = "5"              # concurrent HashMap
parking_lot  = "0.12"          # быстрые мьютексы
rayon        = "1"              # параллельные итераторы
once_cell    = "1"
itertools    = "0.12"

# Config
config       = "0.13"
toml         = "0.8"

# Testing
criterion    = { version = "0.5", features = ["html_reports"] }
proptest     = "1"              # property-based тесты
tokio-test   = "0.4"
tempfile     = "3"

# Internal crates
rc-primitives = { path = "crates/primitives" }
rc-crypto     = { path = "crates/crypto" }
rc-consensus  = { path = "crates/consensus" }
rc-storage    = { path = "crates/storage" }
rc-mempool    = { path = "crates/mempool" }
rc-p2p        = { path = "crates/p2p" }
rc-vm         = { path = "crates/vm" }
rc-rpc        = { path = "crates/rpc" }
rc-wallet     = { path = "crates/wallet" }
rc-node       = { path = "crates/node" }

# ─── Workspace-wide optimisation profiles ─────────────────────────────────────
[profile.dev]
opt-level   = 1     # чуть быстрее чем 0, хорошо для тестов

[profile.release]
opt-level   = 3
lto         = "thin"
codegen-units = 1
panic       = "abort"
strip       = "symbols"

[profile.bench]
inherits    = "release"
debug       = true  # нужен для flamegraph

[profile.ci]
inherits    = "dev"
incremental = false  # воспроизводимые сборки в CI
