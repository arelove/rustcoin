# rustfmt.toml — единый стиль форматирования для всего проекта
edition            = "2021"
max_width          = 100
tab_spaces         = 4
use_small_heuristics = "Default"
imports_granularity = "Crate"   # группирует imports по крейту
group_imports      = "StdExternalCrate"  # std → external → crate
newline_style      = "Unix"
trailing_comma     = "Vertical"
wrap_comments      = true
format_code_in_doc_comments = true
